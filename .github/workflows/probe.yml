name: Probe sources

# データセンターIPから各データ取得元にアクセスできるか調べる一時的な調査用。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 取得元の応答を確認
        run: |
          node -e '
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";
          const rich = {
            "User-Agent": UA,
            "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
            "Accept-Language": "ja,en-US;q=0.9,en;q=0.8",
            "Accept-Encoding": "gzip, deflate, br",
            "Upgrade-Insecure-Requests": "1",
            "Sec-Fetch-Dest": "document",
            "Sec-Fetch-Mode": "navigate",
            "Sec-Fetch-Site": "none",
            "Sec-Fetch-User": "?1",
            "sec-ch-ua": "\"Chromium\";v=\"126\", \"Not:A-Brand\";v=\"24\"",
            "sec-ch-ua-mobile": "?0",
            "sec-ch-ua-platform": "\"Windows\"",
          };
          const targets = [
            ["Yahoo信用残 (UAのみ)",   "https://finance.yahoo.co.jp/quote/7203.T/margin", {"User-Agent": UA}],
            ["Yahoo信用残 (全ヘッダ)", "https://finance.yahoo.co.jp/quote/7203.T/margin", rich],
            ["Yahoo検索",              "https://finance.yahoo.co.jp/search/?query=%E3%83%88%E3%83%A8%E3%82%BF", rich],
            ["Yahoo米国chart API",     "https://query1.finance.yahoo.com/v8/finance/chart/7203.T?range=5d&interval=1d", {"User-Agent": UA}],
            ["SBI個別銘柄",            "https://site4.sbisec.co.jp/ETGate/?_ControlID=WPLETsiR001Control&_DataStoreID=DSWPLETsiR001Control&_PageID=WPLETsiR001Ilst10&_ActionID=getDetailOfStockPriceJP&s_rkbn=1&i_dom_flg=1&i_exchange_code=JPN&i_output_type=0&stock_sec_code_mul=7203&exchange_code=TKY&ref_from=1&ref_to=20&getFlg=on", rich],
            ["JPX信用取引残高",        "https://www.jpx.co.jp/markets/statistics-equities/margin/05.html", rich],
            ["株探",                   "https://kabutan.jp/stock/?code=7203", rich],
            ["みんかぶ信用残",         "https://minkabu.jp/stock/7203/margin_balance", rich],
            ["日証金",                 "https://www.jsf.co.jp/de/stock/dispatcher/", rich],
          ];
          (async () => {
            for (const [name, url, headers] of targets) {
              const t = Date.now();
              try {
                const res = await fetch(url, { headers, redirect: "follow" });
                const body = await res.text();
                console.log(
                  name.padEnd(24) + " HTTP " + res.status +
                  "  " + String(body.length).padStart(8) + " bytes  " +
                  (Date.now() - t) + "ms"
                );
              } catch (e) {
                console.log(name.padEnd(24) + " 例外: " + e.message);
              }
            }
          })();
          '
