name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - config.js
      - data/**
      - .github/workflows/pages.yml
  # データ更新ワークフローの後にも配信し直す
  # (GITHUB_TOKEN による push は push イベントを発火しないため)
  workflow_run:
    workflows: ["Update margin data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1つだけ。進行中のものは終わらせてから最新を配信する。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配信するファイルだけ _site にまとめる
        run: |
          mkdir -p _site
          cp index.html config.js _site/
          cp -r data _site/data
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
