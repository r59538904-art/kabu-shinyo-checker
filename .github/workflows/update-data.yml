name: Update margin data

on:
  schedule:
    # 信用残は毎週金曜申込ぶんが翌週第2営業日ごろ(火〜水)に公表される。
    # 水曜 10:00 JST (= 01:00 UTC) に取得する。
    - cron: "0 1 * * 3"
    # 取得元のレート制限は IP 単位で、Actions のランナーIPは共有のため
    # 運悪く制限中のIPを引くことがある。翌日にも走らせて取りこぼしを防ぐ。
    - cron: "0 1 * * 4"
  workflow_dispatch:
    inputs:
      codes:
        description: "追加/更新する銘柄コード (スペース区切り。空なら保存済み銘柄をすべて更新)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 信用残データを取得
        # 入力はシェルに直接展開せず環境変数経由で渡す (コマンド注入対策)
        env:
          CODES: ${{ github.event.inputs.codes }}
        run: node scripts/update-data.js "$CODES"

      - name: sitemap.xml を作り直す
        run: node scripts/build-seo.js

      - name: 変更があればコミット
        run: |
          if [ -z "$(git status --porcelain data sitemap.xml)" ]; then
            echo "更新はありませんでした"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data sitemap.xml
          git commit -m "data: 信用残データを更新 ($(date -u '+%Y-%m-%d'))"
          git push
